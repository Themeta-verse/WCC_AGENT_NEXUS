[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-independent"
version = "0.2.0"
description = "Independent authenticated evidence-first NEXUS mission runtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "pydantic>=2.0,<3",
]

[project.scripts]
nexus-independent = "nexus_independent.cli:main"
nexus = "nexus_independent.cli:main"

[tool.setuptools]
packages = ["runtime", "nexus_independent"]
