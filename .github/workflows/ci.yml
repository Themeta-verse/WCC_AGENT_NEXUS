name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install independent runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-standalone.txt

      - name: Compile independent runtime
        run: PYTHONPATH=.:./scripts python -m py_compile nexus_independent/*.py runtime/*.py scripts/operator_runtime_proof.py scripts/ascension_cockpit_proof.py

      - name: Run independent product acceptance
        run: |
          PYTHONPATH=. python tests/independent_product_benchmark.py
          PYTHONPATH=. python tests/final_transition_e2e.py
          PYTHONPATH=. python tests/ascension_product_benchmark.py

      - name: Run canonical historical regression suite
        run: |
          for test_file in tests/*benchmark.py; do
            PYTHONPATH=.:./runtime python "$test_file"
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Validate portable command center
        run: |
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build

      - name: Run operator security and process proof
        run: |
          PYTHONPATH=. python tests/operator_security_hardening.py
          PYTHONPATH=. python scripts/operator_runtime_proof.py

      - name: Reject environment files
        shell: bash
        run: |
          if find . -type f \( -name '.env' -o -name '.env.local' -o -name '.env.production' \) -not -path './.git/*' | grep -q .; then
            echo 'Environment files are prohibited in this repository.' >&2
            exit 1
          fi

      - name: Scan tracked content for common secret patterns
        shell: bash
        run: |
          if git grep -n -I -E '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9_]{20,})' -- . ':!docs/sprints/*'; then
            echo 'Potential credential pattern found in tracked content.' >&2
            exit 1
          fi

      - name: Reject external development-runtime coupling
        shell: bash
        run: |
          if git grep -n -I -E 'manus-storage|vite-plugin-manus|BUILT_IN_FORGE|manus\.computer' -- . ':!frontend/pnpm-lock.yaml'; then
            echo 'Independent product source must not retain external development-runtime coupling.' >&2
            exit 1
          fi
